/**
 * Top-level build file where you can add configuration options common to all sub-projects/modules.
 *
 * @author Armin Schnabel
 * @version 2.3.0
 * @since 1.0.0
 */

buildscript {
    ext.gradle_version = "9.4.1"
    ext.kotlin_version = "2.4.21" // Kotlin is built into AGP 9, this sets the Kotlin version

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:$gradle_version"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

plugins {
    id 'com.google.protobuf' version '0.10.0' apply false // Maybe keep in sync with other usages
}

ext {
    // This libraries version
    version = "0.0.0" // Automatically overwritten by CI
    groupId = 'de.cyface'
    artifactId = 'android-utils'

    // Android SDK versions
    minSdkVersion = 26 // device support
    targetSdkVersion = 36 // behavioral changes, follow migration guide & test the app against this
    compileSdkVersion = 37 // allows newest APIs to be used and to see deprecations, use latest

    // Android dependencies
    androidxAppCompatVersion = "1.8.0"
    datastoreVersion = "1.3.0"

    // Other
    protobufVersion = '4.36.2' // For Proto Datastore. Maybe keep in sync with other versions.

    // Testing
    junitVersion = "1.3.0"
    mockitoVersion = '5.24.0'
    hamcrestVersion = "3.0"
    rulesVersion = "1.7.0"
    robolectricVersion = "4.17"
    testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"

    // Java version
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

allprojects {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
